version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentra-fraud-api
    ports:
      - "7860:7860"
      - "5001:7860"
    environment:
      - PORT=7860
      - FLASK_ENV=production
    volumes:
      # Mount data folder to persist SQLite decisions database across container restarts
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
